plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'SquidDev'
                url = 'https://maven.squiddev.cc'
            }
        }
        filter { includeGroup 'cc.tweaked' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        // Put the mods under test into run/mods (CC: Tweaked, Thaumaturge, Curios, Lithostitched).
        client {
            client()
        }
        // ./gradlew runGameTestServer: headless, no window; runs the ccthaumic game tests and exits.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // CC: Tweaked public API (generic peripherals, @LuaFunction, PeripheralCapability).
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-core-api:${cc_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-common-api:${cc_version}"
    compileOnly "cc.tweaked:cc-tweaked-1.21.1-forge-api:${cc_version}"
    // Thaumaturge has no up-to-date public maven. Put its jar into libs/ (local only, never
    // shipped or committed); it is only needed to compile.
    compileOnly fileTree(dir: 'libs', include: 'thaumaturge-*.jar')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
